<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dicas Encceja 2026 - Plataforma Completa</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#1e40af;--light:#eff6ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;background:#f8fafc;color:#0f172a}
h1,h2,h3{font-family:'Plus Jakarta Sans',sans-serif}
.header{background:radial-gradient(1200px 400px at 20% 0%,#3b82f6, #1e3a8a);color:white;padding:32px 20px;text-align:center}
.header h1{font-size:32px;margin:0;line-height:1.1}
.header p{opacity:.9;max-width:600px;margin:12px auto}
.badge{display:inline-block;background:white;color:#1e40af;padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px}
.container{max-width:800px;margin:-20px auto 0;padding:0 14px 40px}
.card{background:white;border-radius:22px;padding:22px;margin-top:18px;box-shadow:0 10px 30px #0001;border:1px solid #e2e8f0}
.card h2{margin:0 0 8px;color:#1e3a8a;display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid2{grid-template-columns:1fr}}
.stat{background:#f1f5f9;border-radius:14px;padding:14px;text-align:center;border:2px solid #e2e8f0}
.stat b{font-size:22px;display:block;color:#1e3a8a}

/* ANIMAÇÕES FRAÇÕES */
.pizza-wrap{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:16px 0}
.pizza{width:110px;height:110px;border-radius:50%;border:4px solid #1e3a8a;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;background:white;position:relative}
.pizza span{border:.5px solid #fff;display:block}
.fill{background:linear-gradient(135deg,#3b82f6,#06b6d4);animation:pop .5s ease}
@keyframes pop{0%{transform:scale(0)} 80%{transform:scale(1.1)} 100%{transform:scale(1)}}
.bar{height:26px;background:#e2e8f0;border-radius:999px;overflow:hidden;border:2px solid #1e3a8a;display:flex;margin:10px 0}
.bar i{height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee);display:block;transition:width 1s cubic-bezier(.34,1.56,.64,1);width:0}
.btn{border:none;padding:12px 16px;border-radius:12px;font-weight:800;cursor:pointer;transition:.15s}
.btn-blue{background:#2563eb;color:white}.btn-ghost{background:#f1f5f9;color:#1e3a8a;border:2px solid #e2e8f0}
.btn:active{transform:scale(.96)}
.btn.active{background:#0f172a;color:white}
.calc{font-size:28px;font-weight:900;text-align:center;margin:14
